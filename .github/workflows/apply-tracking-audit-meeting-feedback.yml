name: Apply Tracking Audit meeting feedback

on:
  push:
    branches:
      - fix/tracking-audit-meeting-feedback-20260908

permissions:
  contents: write

concurrency:
  group: tracking-audit-meeting-feedback-patch
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        run: node scripts/apply-tracking-audit-meeting-feedback.mjs

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Lint affected source
        run: npm run lint

      - name: Run affected unit and integration tests
        run: >-
          npx vitest run
          src/test/tracking-audit-spend.test.tsx
          src/test/tracking-landing.accessibility.test.tsx
          src/test/tracking-audit-professional-services.test.tsx
          src/test/tracking-audit-education.test.tsx
          src/test/tracking-audit-real-estate.test.tsx
          src/test/api-endpoints.test.ts
          src/test/index.homepage.test.tsx

      - name: Build production bundle
        run: npm run build

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e
          git commit -m "Apply Tracking Audit meeting feedback [generated-meeting-feedback]"
          git push origin HEAD:fix/tracking-audit-meeting-feedback-20260908
