name: Apply Tracking Audit meeting feedback

on:
  push:
    branches:
      - fix/tracking-audit-meeting-feedback-20260908

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        run: node scripts/apply-tracking-audit-meeting-feedback.mjs

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Run canonical release gate
        run: npm run release:prepare

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e
          git commit -m "Apply Tracking Audit meeting feedback [generated-meeting-feedback]"
          git push origin HEAD:fix/tracking-audit-meeting-feedback-20260908
